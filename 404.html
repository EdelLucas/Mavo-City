<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seite nicht gefunden – Mavo City</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d0f14">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .notfound { min-height: 80vh; display: grid; place-items: center; text-align: center; padding: 32px 16px; }
    .notfound h1 { font-size: clamp(4rem, 15vw, 8rem); margin: 0; color: var(--accent); line-height: 1; }
    .notfound p { color: var(--muted); margin: 12px 0 28px; }
  </style>
</head>
<body>
  <main class="notfound">
    <div>
      <img src="/assets/logo.svg" alt="" width="72" height="72">
      <h1>404</h1>
      <p>Diese Straße gibt es in Mavo City nicht. / This page doesn't exist.</p>
      <a class="btn btn--primary" href="/">Zur Startseite</a>
    </div>
  </main>
</body>
</html>
